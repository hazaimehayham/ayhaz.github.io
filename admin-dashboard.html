<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MedComfy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        function checkAuth() {
            if(localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'admin.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin.html';
        }
        
        function saveContent() {
            // Save content to localStorage (in a real app, this would save to a database)
            const aboutContent = document.getElementById('about-content').value;
            const contactContent = document.getElementById('contact-content').value;
            
            localStorage.setItem('aboutPageContent', aboutContent);
            localStorage.setItem('contactPageContent', contactContent);
            
            alert('Content saved successfully!');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            
            // Load existing content
            document.getElementById('about-content').value = 
                localStorage.getItem('aboutPageContent') || 
                'Default about page content. Edit this in the admin dashboard.';
                
            document.getElementById('contact-content').value = 
                localStorage.getItem('contactPageContent') || 
                'Default contact page content. Edit this in the admin dashboard.';
        });
    </script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <div class="bg-white shadow-sm">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Admin Dashboard</h1>
                <button onclick="logout()" class="text-red-600 hover:text-red-800">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </div>
        
        <div class="container mx-auto px-6 py-8">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- About Page Editor -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold mb-4">Edit About Page</h2>
                    <textarea id="about-content" class="w-full h-64 p-3 border rounded mb-4"></textarea>
                    <button onclick="saveContent()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Save Changes
                    </button>
                </div>
                
                <!-- Contact Page Editor -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold mb-4">Edit Contact Page</h2>
                    <textarea id="contact-content" class="w-full h-64 p-3 border rounded mb-4"></textarea>
                    <button onclick="saveContent()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Save Changes
                    </button>
                </div>
            </div>
            <!-- Product Management -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Product Management</h2>
                    <a href="admin-products.html" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-edit mr-1"></i> Manage Products
                    </a>
                </div>
                <p>Edit and manage your product catalog.</p>
            </div>

            <!-- Order Management -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Order Management</h2>
                    <a href="admin-orders.html" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-clipboard-list mr-1"></i> View Orders
                    </a>
                </div>
                <p>View and manage customer orders.</p>
            </div>

            <!-- User Management -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">User Management</h2>
                    <a href="admin-users.html" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-users mr-1"></i> Manage Users
                    </a>
                </div>
                <p>Create and manage employee accounts.</p>
            </div>
</div>
    </div>
</body>
</html>
