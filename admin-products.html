<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - MedComfy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        function checkAuth() {
            if(localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'admin.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin.html';
        }
        function loadProducts() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const productsTable = document.getElementById('products-table');
            
            productsTable.innerHTML = products.map(product => `
                <tr class="border-b">
                    <td class="py-3 px-4">${product.id}</td>
                    <td class="py-3 px-4">
                        <div class="flex items-center">
                            <img src="${product.image}" alt="${product.name}" class="w-12 h-12 object-cover rounded mr-3">
                            <div>
                                <p class="font-medium">${product.name}</p>
                                <p class="text-sm text-gray-500">${product.category}</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-3 px-4">${product.price.toFixed(2)}</td>
                    <td class="py-3 px-4">
                        <button onclick="editProduct('${product.id}')" class="text-blue-600 hover:text-blue-800 mr-2">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteProduct('${product.id}')" class="text-red-600 hover:text-red-800">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function editProduct(id) {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const product = products.find(p => p.id === id);
            
            if (!product) return;
            
            document.getElementById('edit-id').value = product.id;
            document.getElementById('edit-name').value = product.name;
            document.getElementById('edit-price').value = product.price;
            document.getElementById('edit-image').value = product.image;
            document.getElementById('edit-description').value = product.description;
            document.getElementById('edit-category').value = product.category;
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        
        function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const price = parseFloat(document.getElementById('edit-price').value);
            const image = document.getElementById('edit-image').value;
            const description = document.getElementById('edit-description').value;
            const category = document.getElementById('edit-category').value;
            
            if (!name || isNaN(price) || !image) {
                alert('Please fill all required fields');
                return;
            }
            
            let products = JSON.parse(localStorage.getItem('products')) || [];
            const existingProduct = products.find(p => p.id === id);
            
            if (existingProduct) {
                // Update existing product
                existingProduct.name = name;
                existingProduct.price = price;
                existingProduct.image = image;
                existingProduct.description = description;
                existingProduct.category = category;
            } else {
                // Add new product
                products.push({
                    id: id || Date.now().toString(),
                    name,
                    price,
                    image,
                    description,
                    category
                });
            }
            
            localStorage.setItem('products', JSON.stringify(products));
            closeModal();
            loadProducts();
        }
        
        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(p => p.id !== id);
            
            localStorage.setItem('products', JSON.stringify(products));
            loadProducts();
        }
        
        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }
        
        function addNewProduct() {
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-name').value = '';
            document.getElementById('edit-price').value = '';
            document.getElementById('edit-image').value = '';
            document.getElementById('edit-description').value = '';
            document.getElementById('edit-category').value = 'medical';
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadProducts();
        });
document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <div class="bg-white shadow-sm">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Product Management</h1>
                <div>
                    <a href="admin-dashboard.html" class="text-blue-600 hover:text-blue-800 mr-4">
                        <i class="fas fa-arrow-left mr-1"></i> Dashboard
                    </a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
        
        <div class="container mx-auto px-6 py-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">All Products</h2>
                    <button onclick="addNewProduct()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        <i class="fas fa-plus mr-1"></i> Add Product
                    </button>
</div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="py-3 px-4 text-left">ID</th>
                                <th class="py-3 px-4 text-left">Product</th>
                                <th class="py-3 px-4 text-left">Price</th>
                                <th class="py-3 px-4 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table">
                            <!-- Products will be loaded here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Edit Product Modal -->
            <div id="edit-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-lg shadow-lg w-full max-w-md">
                    <div class="p-6">
                        <h3 class="text-xl font-bold mb-4" id="modal-title">Edit Product</h3>
                        <input type="hidden" id="edit-id">
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Name</label>
                            <input type="text" id="edit-name" class="w-full px-3 py-2 border rounded" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Price</label>
                            <input type="number" id="edit-price" class="w-full px-3 py-2 border rounded" min="0" step="0.01" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Image URL</label>
                            <input type="url" id="edit-image" class="w-full px-3 py-2 border rounded" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Description</label>
                            <textarea id="edit-description" class="w-full px-3 py-2 border rounded" rows="3"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Category</label>
                            <select id="edit-category" class="w-full px-3 py-2 border rounded">
                                <option value="medical">Medical</option>
                                <option value="comfort">Comfort</option>
                            </select>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-6 py-4 flex justify-end">
                        <button onclick="closeModal()" class="px-4 py-2 text-gray-600 mr-2">Cancel</button>
                        <button onclick="saveProduct()" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
                    </div>
                </div>
            </div>
</div>
            </div>
        </div>
    </div>
</body>
</html>
