<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MedComfy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        function checkAuth() {
            if(localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'admin.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin.html';
        }
        
        function createUser() {
            const username = document.getElementById('new-username').value;
            const password = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;
            
            if (!username || !password) {
                alert('Please fill all fields');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            if (users.some(u => u.username === username)) {
                alert('Username already exists');
                return;
            }
            
            users.push({
                username,
                password,
                role,
                created: new Date().toISOString()
            });
            
            localStorage.setItem('users', JSON.stringify(users));
            alert('User created successfully');
            document.getElementById('user-form').reset();
            loadUsers();
        }
        
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const usersContainer = document.getElementById('users-container');
            
            if (users.length === 0) {
                usersContainer.innerHTML = '<p class="text-center py-8">No users found</p>';
                return;
            }
            
            usersContainer.innerHTML = users.map(user => `
                <div class="bg-white rounded-lg shadow-md p-6 mb-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold">${user.username}</h3>
                            <p class="text-gray-600">${user.role} • Created: ${new Date(user.created).toLocaleDateString()}</p>
                        </div>
                        <div class="flex space-x-2">
                            <span class="px-2 py-1 rounded text-xs font-medium 
                                ${user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 
                                  'bg-blue-100 text-blue-800'}">
                                ${user.role}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadUsers();
        });
    </script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <div class="bg-white shadow-sm">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">User Management</h1>
                <div>
                    <a href="admin-dashboard.html" class="text-blue-600 hover:text-blue-800 mr-4">
                        <i class="fas fa-arrow-left mr-1"></i> Dashboard
                    </a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
        
        <div class="container mx-auto px-6 py-8">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold mb-4">Create New User</h2>
                    <form id="user-form" onsubmit="event.preventDefault(); createUser();">
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2" for="new-username">Username</label>
                            <input type="text" id="new-username" class="w-full px-3 py-2 border rounded" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2" for="new-password">Password</label>
                            <input type="password" id="new-password" class="w-full px-3 py-2 border rounded" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2" for="new-role">Role</label>
                            <select id="new-role" class="w-full px-3 py-2 border rounded" required>
                                <option value="admin">Admin</option>
                                <option value="employee" selected>Employee</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                            Create User
                        </button>
                    </form>
                </div>
                
                <div>
                    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h2 class="text-xl font-bold mb-4">Existing Users</h2>
                        <div id="users-container">
                            <!-- Users will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
